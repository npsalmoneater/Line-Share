<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Share Flex</title>
    <script src="https://line-scdn.net"></script>
</head>
<body>
    <h2 style="text-align: center; margin-top: 50px; font-family: sans-serif; color: #333;">กำลังโหลดระบบแชร์...</h2>

    <script>
        function main() {
            // ⚠️ เปลี่ยนรหัสในเครื่องหมายอัญประกาศตรงนี้ให้เป็น LIFF ID จริงของคุณ (เช่น "2006543210-AbCdEfGh")
            const MY_LIFF_ID = "2012186247-OzYFFJAc";

            liff.init({ liffId: MY_LIFF_ID }).then(() => {
                if (liff.isApiAvailable('shareTargetPicker')) {
                    liff.shareTargetPicker([
                        {
                            "type": "flex",
                            "altText": "คุณได้รับข้อความโปรโมชัน",
                            "contents": {
                              "type": "carousel",
                              "contents": [
                                {
                                  "type": "bubble",
                                  "hero": {
                                    "type": "image",
                                    "url": "https://unsplash.com",
                                    "size": "full",
                                    "aspectRatio": "20:13",
                                    "aspectMode": "cover"
                                  },
                                  "body": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "contents": [
                                      {
                                        "type": "text",
                                        "text": "โปรโมชันที่ 1",
                                        "weight": "bold",
                                        "size": "xl"
                                      },
                                      {
                                        "type": "text",
                                        "text": "รายละเอียดโปรโมชันแรกของคุณ ใส่ข้อความดึงดูดใจตรงนี้",
                                        "size": "sm",
                                        "color": "#666666",
                                        "wrap": true,
                                        "margin": "md"
                                      }
                                    ]
                                  },
                                  "footer": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "spacing": "sm",
                                    "contents": [
                                      {
                                        "type": "button",
                                        "style": "link",
                                        "height": "sm",
                                        "action": {
                                          "type": "uri",
                                          "label": "ดูรายละเอียด",
                                          "uri": "https://line.me"
                                        }
                                      }
                                    ]
                                  }
                                },
                                {
                                  "type": "bubble",
                                  "hero": {
                                    "type": "image",
                                    "url": "https://unsplash.com",
                                    "size": "full",
                                    "aspectRatio": "20:13",
                                    "aspectMode": "cover"
                                  },
                                  "body": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "contents": [
                                      {
                                        "type": "text",
                                        "text": "โปรโมชันที่ 2",
                                        "weight": "bold",
                                        "size": "xl"
                                      },
                                      {
                                        "type": "text",
                                        "text": "รายละเอียดโปรโมชันที่สอง สิทธิพิเศษเฉพาะสมาชิกเท่านั้น",
                                        "size": "sm",
                                        "color": "#666666",
                                        "wrap": true,
                                        "margin": "md"
                                      }
                                    ]
                                  },
                                  "footer": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "spacing": "sm",
                                    "contents": [
                                      {
                                        "type": "button",
                                        "style": "link",
                                        "height": "sm",
                                        "action": {
                                          "type": "uri",
                                          "label": "ดูรายละเอียด",
                                          "uri": "https://line.me"
                                        }
                                      }
                                    ]
                                  }
                                },
                                {
                                  "type": "bubble",
                                  "body": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "contents": [
                                      {
                                        "type": "text",
                                        "text": "แชร์ให้เพื่อนเลย! 🚀",
                                        "weight": "bold",
                                        "size": "lg",
                                        "align": "center",
                                        "gravity": "center"
                                      },
                                      {
                                        "type": "text",
                                        "text": "ส่งต่อสิ่งดีๆ หรือโปรโมชันนี้ให้กับเพื่อนหรือกลุ่มของคุณ",
                                        "size": "sm",
                                        "color": "#aaaaaa",
                                        "wrap": true,
                                        "margin": "md",
                                        "align": "center"
                                      }
                                    ]
                                  },
                                  "footer": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "spacing": "sm",
                                    "contents": [
                                      {
                                        "type": "button",
                                        "style": "primary",
                                        "height": "sm",
                                        "color": "#06C755",
                                        "action": {
                                          "type": "uri",
                                          "label": "กดเพื่อแชร์ต่อ 🔄",
                                          "uri": "https://line.me" + MY_LIFF_ID
                                        }
                                      }
                                    ]
                                  }
                                }
                              ]
                            }
                        }
                    ]).then((res) => {
                        liff.closeWindow();
                    }).catch((error) => {
                        console.error(error);
                        alert("เกิดข้อผิดพลาดในการแชร์: " + error.message);
                    });
                } else {
                    alert("กรุณาเปิดสิทธิ์ Share Target Picker ใน LINE Developers ก่อน");
                }
            }).catch((err) => {
                console.error("LIFF เกิดข้อผิดพลาดในการเปิดระบบ:", err);
                alert("ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาเช็กชื่อระบบหรือ Endpoint URL");
            });
        }
        main();
    </script>
</body>
</html>
